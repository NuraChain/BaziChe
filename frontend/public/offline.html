<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
        <meta name="theme-color" content="#0B1220"/>
        <meta name="robots" content="noindex"/>
        <title>Baziche</title>
        <style>
            :root { color-scheme: dark; }
            * { box-sizing: border-box; }
            body
            {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
                background: #0B1220;
                color: #E6EAF2;
                font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
                text-align: center;
            }
            main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
            img { width: 72px; height: 72px; border-radius: 18px; }
            h1 { margin: 8px 0 0; font-size: 1.25rem; }
            p { margin: 0; color: #9AA4B8; }
            button
            {
                margin-top: 12px;
                min-height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 10px;
                background: #E6EAF2;
                color: #0B1220;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon-192.png" alt=""/>
            <h1 id="title">You are offline</h1>
            <p id="body">Baziche needs a connection. Check your internet, then try again.</p>
            <button id="again" type="button">Try again</button>
        </main>
        <script>
            (function ()
            {
                // What the worker answers a page with when the network does not: it is cached on its
                // own, so it cannot read the app's catalogues, and carries its few words itself.
                var WORDS = {
                    en: ['ltr', 'You are offline', 'Baziche needs a connection. Check your internet, then try again.', 'Try again'],
                    fa: ['rtl', 'به اینترنت وصل نیستید', 'بازیچه به اینترنت نیاز دارد. اتصال خود را بررسی کنید و دوباره تلاش کنید.', 'تلاش دوباره'],
                    ar: ['rtl', 'أنت غير متصل', 'يحتاج بازيچه إلى اتصال بالإنترنت. تحقّق من اتصالك ثم حاول مجددًا.', 'حاول مجددًا'],
                    es: ['ltr', 'Sin conexión', 'Baziche necesita conexión. Revisa tu internet e inténtalo de nuevo.', 'Reintentar'],
                    fr: ['ltr', 'Vous êtes hors ligne', 'Baziche a besoin d’une connexion. Vérifiez votre accès à internet, puis réessayez.', 'Réessayer'],
                    hi: ['ltr', 'आप ऑफ़लाइन हैं', 'बाज़ीचे को इंटरनेट कनेक्शन चाहिए। अपना कनेक्शन जाँचें और फिर से कोशिश करें।', 'फिर से कोशिश करें'],
                    pt: ['ltr', 'Sem conexão', 'O Baziche precisa de conexão. Verifique sua internet e tente de novo.', 'Tentar de novo'],
                    ru: ['ltr', 'Нет подключения', 'Baziche нужен интернет. Проверьте подключение и попробуйте снова.', 'Попробовать снова'],
                    tr: ['ltr', 'Çevrimdışısınız', 'Baziche için bağlantı gerekiyor. İnternetinizi kontrol edip tekrar deneyin.', 'Tekrar dene'],
                    zh: ['ltr', '你已离线', 'Baziche 需要网络连接。请检查网络后重试。', '重试']
                };

                function chosen()
                {
                    var pairs = document.cookie.split('; ');

                    for (var index = 0; index < pairs.length; index += 1)
                    {
                        var pair = pairs[index].split('=');

                        if (pair[0] === 'locale' && WORDS[pair[1]] !== undefined)
                        {
                            return pair[1];
                        }
                    }

                    var asked = navigator.languages || [navigator.language || 'en'];

                    for (var at = 0; at < asked.length; at += 1)
                    {
                        var lang = String(asked[at]).toLowerCase().split('-')[0];

                        if (WORDS[lang] !== undefined)
                        {
                            return lang;
                        }
                    }

                    return 'en';
                }

                var lang = chosen();
                var words = WORDS[lang];
                var root = document.documentElement;

                root.setAttribute('lang', lang);
                root.setAttribute('dir', words[0]);
                document.getElementById('title').textContent = words[1];
                document.getElementById('body').textContent = words[2];
                document.getElementById('again').textContent = words[3];
                document.getElementById('again').addEventListener('click', function ()
                {
                    window.location.reload();
                });
                window.addEventListener('online', function ()
                {
                    window.location.reload();
                });
            })();
        </script>
    </body>
</html>
