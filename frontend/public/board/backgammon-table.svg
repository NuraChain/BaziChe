<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820">
    <title>Walnut and brass Backgammon table</title>
    <defs>
        <linearGradient id="walnut" x2="100%" y2="100%">
            <stop stop-color="#8A6041"/>
            <stop offset=".24" stop-color="#4A2E1C"/>
            <stop offset=".55" stop-color="#5A3B2B"/>
            <stop offset="1" stop-color="#291A15"/>
        </linearGradient>
        <linearGradient id="brass" x2="100%" y2="100%">
            <stop stop-color="#FFE4A2"/>
            <stop offset=".38" stop-color="#C9A15C"/>
            <stop offset=".68" stop-color="#805A3A"/>
            <stop offset="1" stop-color="#D3AD6C"/>
        </linearGradient>
        <radialGradient id="field" cx="45%" cy="46%" r="72%">
            <stop stop-color="#E6CCAA"/>
            <stop offset=".66" stop-color="#CFAB81"/>
            <stop offset="1" stop-color="#9A7352"/>
        </radialGradient>
        <linearGradient id="bar">
            <stop stop-color="#281815"/>
            <stop offset=".13" stop-color="#79543D"/>
            <stop offset=".48" stop-color="#53372A"/>
            <stop offset=".88" stop-color="#38241C"/>
            <stop offset="1" stop-color="#20130E"/>
        </linearGradient>
        <linearGradient id="tray">
            <stop stop-color="#1B100B"/>
            <stop offset=".16" stop-color="#3A2416"/>
            <stop offset=".67" stop-color="#503529"/>
            <stop offset="1" stop-color="#241610"/>
        </linearGradient>
        <linearGradient id="point-wine" x2="100%" y2="16%">
            <stop stop-color="#572624"/>
            <stop offset=".45" stop-color="#983B35"/>
            <stop offset=".8" stop-color="#762C29"/>
            <stop offset="1" stop-color="#522422"/>
        </linearGradient>
        <linearGradient id="point-green" x2="100%" y2="16%">
            <stop stop-color="#17332D"/>
            <stop offset=".46" stop-color="#487261"/>
            <stop offset=".8" stop-color="#2D5045"/>
            <stop offset="1" stop-color="#182F28"/>
        </linearGradient>
        <pattern id="grain" width="330" height="38" patternUnits="userSpaceOnUse">
            <path d="M0 4C76 4 92 0 154 2S266 6 330 4M0 18C64 18 92 15 143 15S255 24 330 18M0 30C74 30 85 28 128 28S277 29 330 30" fill="none" stroke="#231410" stroke-width=".9" stroke-opacity=".48"/>
            <path d="M0 9C74 9 88 3 160 7S269 11 330 9M0 13C66 13 106 9 163 11S262 15 330 13M0 25C86 25 111 19 171 21S259 27 330 25M0 34C86 34 108 30 170 31S268 36 330 34" fill="none" stroke="#E6B181" stroke-width=".65" stroke-opacity=".25"/>
        </pattern>
        <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M-3 3L3-3M0 6L6 0M3 9L9 3" fill="none" stroke="#3B241A" stroke-width=".68" stroke-opacity=".14"/>
            <path d="M-2 3L3 8M1 0L7 6M4-3L9 2" fill="none" stroke="#FFF0D1" stroke-width=".55" stroke-opacity=".17"/>
        </pattern>
        <pattern id="bar-grain" href="#grain" patternTransform="rotate(90)"/>
        <path id="point" d="M0 0H66.5L33.25 324.24Z"/>
        <g id="points" stroke="#231C16" stroke-opacity=".48" stroke-width="1.4" stroke-linejoin="round">
            <use href="#point" fill="url(#point-green)"/>
            <use href="#point" x="66.5" fill="url(#point-wine)"/>
            <use href="#point" x="133" fill="url(#point-green)"/>
            <use href="#point" x="199.5" fill="url(#point-wine)"/>
            <use href="#point" x="266" fill="url(#point-green)"/>
            <use href="#point" x="332.5" fill="url(#point-wine)"/>
        </g>
        <g id="leaf">
            <rect width="399" height="772" rx="4" fill="url(#field)"/>
            <use href="#points"/>
            <use href="#points" transform="translate(399 772) rotate(180)"/>
            <rect width="399" height="772" rx="4" fill="url(#weave)"/>
            <rect width="399" height="772" rx="4" fill="none" stroke="#2D1C15" stroke-width="3"/>
            <rect x="2.5" y="2.5" width="394" height="767" rx="2" fill="none" stroke="#F0D7A6" stroke-opacity=".4"/>
        </g>
        <rect id="well" x="910" width="62" height="378" rx="5" fill="url(#tray)" stroke="#795837" stroke-opacity=".75"/>
    </defs>

    <rect width="1000" height="820" rx="22" fill="url(#walnut)"/>
    <rect width="1000" height="820" rx="22" fill="url(#grain)"/>
    <rect x="2" y="2" width="996" height="816" rx="20" fill="none" stroke="#1D110D" stroke-width="4"/>
    <rect x="12" y="12" width="976" height="796" rx="15" fill="none" stroke="#251711" stroke-width="6"/>
    <rect x="12" y="12" width="976" height="796" rx="15" fill="none" stroke="url(#brass)" stroke-width="2.4"/>

    <use href="#leaf" x="24" y="24"/>
    <use href="#leaf" x="483" y="24"/>

    <rect x="423" y="24" width="60" height="772" rx="3" fill="url(#bar)" stroke="#241611" stroke-width="2"/>
    <rect x="425" y="26" width="56" height="768" rx="2" fill="url(#bar-grain)"/>
    <rect x="428" y="28" width="50" height="764" rx="3" fill="none" stroke="url(#brass)" stroke-opacity=".66" stroke-width="1.6"/>

    <rect x="906" y="24" width="70" height="772" rx="8" fill="#21140E" stroke="url(#brass)" stroke-width="2"/>
    <use href="#well" y="28"/>
    <use href="#well" y="414"/>
    <rect x="910" y="406" width="62" height="8" rx="2" fill="url(#brass)"/>
</svg>
