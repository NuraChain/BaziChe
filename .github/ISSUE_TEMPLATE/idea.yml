name: Idea or change
description: Something Baziche should do, or do differently.
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
  - type: textarea
    id: considered
    attributes:
      label: What else you considered
